appId: com.personalmessenger.desktop
productName: Personal Messenger
copyright: Personal Messenger

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icon.png
  artifactName: PersonalMessenger-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Personal Messenger

portable:
  artifactName: PersonalMessenger-portable-${version}.${ext}
